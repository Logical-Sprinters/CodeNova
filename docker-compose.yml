# One service, one reason: a real PostgreSQL 16, so the integrity rules are
# enforced by a database instead of being described in a slide.
services:
  db:
    image: postgres:16
    container_name: brandguard-db
    environment:
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard
      POSTGRES_DB: brandguard
    command: ["postgres", "--locale=C", "--encoding=UTF8"]
    ports:
      - "5432:5432"
    volumes:
      - brandguard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  brandguard-data:
