name: brandguard
description: "BrandGuard mobile-first brand governance app with a FastAPI backend."
publish_to: 'none'

version: 2.1.0+4

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  material_ui: ^1.1.0
  shared_preferences: ^2.5.6
  cupertino_ui: ^1.1.6
  http: ^1.6.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
